disabled_rules:
  - trailing_whitespace
opt_in_rules: []
included:
  - Sources
  - Tests
line_length:
  warning: 120
  error: 200
force_unwrapping: warning
force_cast: warning
todo:
  warning: "TODO|TODO:"
large_tuple:
  warning: 3
  error: 4
file_length:
  warning: 800
  error: 1200
  ignore_comment_only_lines: true
function_body_length:
  warning: 100
  error: 200
type_body_length:
  warning: 400
  error: 600
